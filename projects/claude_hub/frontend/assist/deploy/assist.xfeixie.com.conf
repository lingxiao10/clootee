# assist.xfeixie.com —— AI 学习小助手组件（纯静态，无后端）
# 服务器 personal1 106.13.193.3，放到 /www/server/panel/vhost/nginx/assist.xfeixie.com.conf
#
# root 直接指向 git 检出目录里的 assist/，所以更新只要 git pull，不用拷文件。
# ⚠️ 该机 nginx 早于 1.25.1，只能用 `listen 443 ssl http2;` 旧写法，
#    独立的 `http2 on;` 会 emerg（与 galaxy.xfeixie.com 同一个坑）。

server {
    listen 80;
    server_name assist.xfeixie.com;

    # acme.sh 续期用的 webroot，放在站点目录外，git pull 不受影响
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/assist.xfeixie.com_acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name assist.xfeixie.com;

    ssl_certificate     /www/server/panel/vhost/cert/assist.xfeixie.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/assist.xfeixie.com/privkey.pem;

    root /www/wwwroot/clootee/projects/claude_hub/frontend/assist;
    index index.html;

    # 组件要被别的域名的页面 <script> 引用，必须放行跨域
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    # docs.md 是给 AI 读的，按纯文本返回，别触发下载
    location = /docs.md {
        add_header Access-Control-Allow-Origin "*" always;
        default_type "text/plain; charset=utf-8";
    }

    access_log /www/wwwlogs/assist.xfeixie.com.log;
    error_log  /www/wwwlogs/assist.xfeixie.com.error.log;
}
