# learn.xfeixie.com —— Clootee 小白教程（纯静态，口令保护）
# 服务器 personal1 106.13.193.3，放到 /www/server/panel/vhost/nginx/learn.xfeixie.com.conf
#
# root 直指 git 检出目录里的 frontend/，更新只要 git pull，不用拷文件、不用重启任何进程。
# ⚠️ 该机 nginx 早于 1.25.1，只能用 `listen 443 ssl http2;` 旧写法，
#    独立的 `http2 on;` 会 emerg（与 galaxy.xfeixie.com 同一个坑）。

server {
    listen 80;
    server_name learn.xfeixie.com;

    # acme.sh 续期用的 webroot，放在站点目录外，git pull 不受影响
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/learn.xfeixie.com_acme;
        auth_basic off;                 # 续期不能被口令挡住
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name learn.xfeixie.com;

    ssl_certificate     /www/server/panel/vhost/cert/learn.xfeixie.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/learn.xfeixie.com/privkey.pem;

    # 教程与它的资源都在 frontend/ 下（styles.css / trans.js / learn*.js / learn/ch0*.js）
    root  /www/wwwroot/clootee/projects/claude_hub/frontend;
    index learn.html;

    # ── 访问口令 ──
    # .htpasswd 不进 git（本仓库是公开的），在服务器上用 htpasswd 生成，见同目录 README.md
    auth_basic           "Clootee tutorial";
    auth_basic_user_file /www/wwwroot/learn.xfeixie.com_auth/.htpasswd;

    # 根路径直接给教程页
    location = / {
        try_files /learn.html =404;
    }

    # index.html 是 Clootee 应用界面，这里没有后端，打开只会是坏的 —— 一律引回教程
    location = /index.html {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 小助手组件要被别的域名的页面 <script> 引用，单独放行跨域
    location ^~ /assist/ {
        auth_basic off;                 # 组件本身是公开资源，不该被口令挡住
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }
    location = /assist/docs.md {
        auth_basic off;
        add_header Access-Control-Allow-Origin "*" always;
        default_type "text/plain; charset=utf-8";
    }

    access_log /www/wwwlogs/learn.xfeixie.com.log;
    error_log  /www/wwwlogs/learn.xfeixie.com.error.log;
}
